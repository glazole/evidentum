services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mvp_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: mvp_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mvp_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Europe/Moscow}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      APP_BASE_URL: https://${DOMAIN}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    networks:
      - backend
      - frontend

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mvp_ui
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Europe/Moscow}
      UI_API_BASE_URL: http://api:8000/api
    depends_on:
      api:
        condition: service_started
    command: >
      sh -c "streamlit run app/streamlit_app.py --server.port 7860 --server.address 0.0.0.0 --server.headless true --server.fileWatcherType none --browser.gatherUsageStats false"
    networks:
      - frontend

  nginx:
    image: nginx:1.27-alpine
    container_name: mvp_nginx
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN for HTTPS deployment}
      NGINX_ENVSUBST_FILTER: DOMAIN
    restart: unless-stopped
    depends_on:
      - api
      - ui
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - frontend

  certbot:
    image: certbot/certbot:latest
    container_name: mvp_certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint: /bin/sh
    command: >
      -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"

volumes:
  postgres_data:
  redis_data:
  certbot_www:
  letsencrypt:

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge


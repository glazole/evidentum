services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mvp_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medguides}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: ${TZ:-Europe/Moscow}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-medguides}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mvp_app
    restart: "no"
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Europe/Moscow}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-medguides}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
    working_dir: /app
    command: ["sleep", "infinity"]
  
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mvp_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Europe/Moscow}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-medguides}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
    working_dir: /app
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    ports:
      - "127.0.0.1:18000:8000"

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mvp_ui
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Europe/Moscow}
      UI_API_BASE_URL: http://api:8000/api
    depends_on:
      - api
    volumes:
      - ./:/app
    working_dir: /app
    command: >
      sh -c "python -m app.ui"
    ports:
      - "127.0.0.1:17860:7860"

volumes:
  postgres_data:

networks:
  drug-code-resolver_mvp-net:
    external: true
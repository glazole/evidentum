services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mvp_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medguides}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: ${TZ:-Europe/Moscow}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-medguides}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mvp-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mvp_app
    restart: "no"
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Europe/Moscow}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-medguides}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
    working_dir: /app
    command: ["sleep", "infinity"]
    networks:
      - mvp-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mvp_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Europe/Moscow}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-medguides}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
    working_dir: /app
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')\""]
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      - mvp-net

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mvp_ui
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Europe/Moscow}
      UI_API_BASE_URL: http://mvp_api:8000/api
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./:/app
    working_dir: /app
    command: >-
      streamlit run app/streamlit_app.py
      --server.port 7860
      --server.address 0.0.0.0
      --server.headless true
      --server.fileWatcherType none
      --browser.gatherUsageStats false
    ports:
      - "127.0.0.1:7860:7860"
    networks:
      - mvp-net

volumes:
  postgres_data:

networks:
  mvp-net:
    external: true
    name: drug-code-resolver_mvp-net